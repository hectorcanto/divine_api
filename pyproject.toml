[project]
name = "divine"
version = "0.1.0"
description = ""
authors = [
    {name = "Hector Canto",email = "hectorcanto@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "uvicorn[standard] (>=0.42.0,<0.43.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "pycountry (>=26.2.16,<27.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "opentelemetry-api (>=1.40.0,<2.0.0)",
    "opentelemetry-sdk (>=1.40.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.61b0,<0.62)",
    "opentelemetry-instrumentation-sqlalchemy (>=0.61b0,<0.62)",
    "opentelemetry-exporter-otlp-proto-grpc (>=1.40.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.1.0"
pytest-env = "^1.6.0"
pytest-mock = "^3.15.1"
python-dotenv = "^1.2.2"
pytest-asyncio = "^1.3.0"
polyfactory = "^3.3.0"
testcontainers = "^4.14.2"
httpx = "^0.28.1"


[tool.poetry.group.dev.dependencies]
isort = "^8.0.1"
ruff = "^0.15.9"
interrogate = "^1.7.0"
basedpyright = "^1.39.0"
bandit = "^1.9.4"
ipdb = "^0.13.13"
ipython = "^9.12.0"
radon = "^6.0.1"
genbadge = {extras = ["coverage"], version = "^1.1.3"}


[tool.isort]
combine_as_imports = true
force_alphabetical_sort_within_sections = true
force_grid_wrap = 2
force_sort_within_sections = true
include_trailing_comma = true
line_length = 120
lines_after_imports = 2
multi_line_output = 3
order_by_type = false
sort_order = "native"
split_on_trailing_comma = true

known_first_party = ["divine"]
# these put test imports at the end
known_tests = ["tests"]
sections="FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,TESTS,LOCALFOLDER"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope= "function"
pythonpath = ["src"]
minversion = "8.0"
addopts = [
    "--cov=src",
    "--junitxml=.reports/junitreport.xml",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml:.reports/coverage.xml",
]
# Use pytes -m integration --cov-append if you want to run in blocks
# Use pytest --no-cov to avoid coverage which sometimes messes up IDE
python_files = ["test_*.py", ]
python_classes = ["Test_", ]
python_functions = [ "test_", ]
testpaths = ["tests", ]
norecursedirs = [".*", "build", "dist"]
junit_family = "xunit2"
filterwarnings = [
    "ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning:passlib",
    "ignore:The frame locals reference is no longer cached:DeprecationWarning:IPython",
]
log_cli = true
log_cli_level="INFO"
log_cli_format="%(levelname)s - %(name)s - %(message)s - %(pathname)s:%(lineno)s"
# "You can use D: (default) as prefix if you don't want to override existing environment variables:"
env = [
    "PYTHONBREAKPOINT=ipdb.set_trace",
    "DB_COMMIT=true",
    "DVV_APP_NAME=TestDivine",
    "DVN_ENV_PURPOSE=TESTS",
    "DVN_ENV_STAGE=local",
    # "DVN_ENV_STAGE=LOCAL_DOCKER",
    "DVN_DB_HOST=localhost",
    "DVN_DB_NAME=divine_test",
    "DVN_DB_USER=test_user",
    "DVN_DB_PASSWORD=not_so_random",
    "DVN_DB_PORT=8432",
    "TEST_DB_PORT=8432",
    "DVN_OTEL_HOST=localhost",
    "DVN_OTEL_PORT=14317",
    # "OTEL_SDK_DISABLED=True",
]

[tool.coverage.run]
branch = true
data_file = ".reports/.coverage"

[tool.coverage.html]
directory = ".reports/htmlcov"

[tool.ruff]
line-length = 120
indent-width = 4
output-format = "concise"

[tool.ruff.lint]
ignore = [
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"**/{tests,docs,tools}/*" = ["S101"]
"**/__init__.py" = ["F401"]
"**/fixtures/*" = ["RUF001", "E501"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/migrations",
]
reportImplicitOverride = "none"

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-nested-classes = true
fail-under = 1
exclude = ["tests", "build", "__init__.py"]
verbose = 2
quiet = false
omit-covered-files = true
ignore-regex = "^__repr__$"

[tool.codespell]
builtin = "clear,rare,informal,usage,code,names"
ignore-words-list = ["master",]
skip= ["poetry.lock", "**/fixtures/*", "**/junitreport.xml", "**/htmlcov", "pyproject.toml"]

[tool.bandit]
targets = ["src"]
exclude = [
    "src/migrations/hooks.py",
]
severity = "LOW"
confidence = "LOW"
